<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate PDF pages — Dossier</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Rotate PDF pages — Dossier">
<meta property="og:description" content="Merge, split, compress, convert, watermark, protect and edit PDFs — entirely in your browser. Nothing is uploaded to a server.">
<meta property="og:image" content="assets/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark">Dossier<span class="dot">.</span></a>
    <nav>
      <a href="index.html">Tools</a>
      <a href="https://github.com/" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>

<section class="tool-page">
  <div class="wrap">
    <div class="tool-head">
      <div class="eyebrow">Organize</div>
      <h1>Rotate pages</h1>
      <p>Rotate every page at once, or fix individual pages that scanned in sideways.</p>
    </div>

    <div class="panel">
      <div class="dropzone" id="dropzone" tabindex="0">
        <div class="dz-title">Drop a PDF here, or click to browse</div>
        <div class="dz-sub">One file at a time.</div>
        <input type="file" id="fileInput" accept=".pdf">
      </div>
      <ul class="file-list" id="fileList"></ul>

      <div class="field-row" id="allRow" style="display:none;">
        <label>Rotate all pages</label>
        <div class="actions" style="margin-top:0;">
          <button class="btn btn-ghost" data-rotate-all="-90">⟲ Rotate all left</button>
          <button class="btn btn-ghost" data-rotate-all="90">⟳ Rotate all right</button>
        </div>
      </div>

      <div class="preview-grid" id="pageGrid"></div>

      <div class="actions" id="actionsRow" style="display:none;">
        <button class="btn btn-primary" id="applyBtn">Apply rotation</button>
      </div>

      <div class="status" id="status"></div>

      <div class="result-box" id="resultBox">
        <div class="rtext"><strong id="resultName"></strong><span id="resultMeta"></span></div>
        <button class="btn btn-primary" id="downloadBtn">Download</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Dossier — browser-only PDF tools.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="js/common.js"></script>
<script src="js/tools/rotate.js"></script>
</body>
</html>
