<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a watermark — Dossier</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Add a watermark — Dossier">
<meta property="og:description" content="Merge, split, compress, convert, watermark, protect and edit PDFs — entirely in your browser. Nothing is uploaded to a server.">
<meta property="og:image" content="assets/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark">Dossier<span class="dot">.</span></a>
    <nav>
      <a href="index.html">Tools</a>
      <a href="https://github.com/" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>

<section class="tool-page">
  <div class="wrap">
    <div class="tool-head">
      <div class="eyebrow">Customize &amp; secure</div>
      <h1>Add a watermark</h1>
      <p>Stamp text diagonally across every page — mark drafts, confidential copies, or add your own label.</p>
    </div>

    <div class="panel">
      <div class="dropzone" id="dropzone" tabindex="0">
        <div class="dz-title">Drop a PDF here, or click to browse</div>
        <div class="dz-sub">One file at a time.</div>
        <input type="file" id="fileInput" accept=".pdf">
      </div>
      <ul class="file-list" id="fileList"></ul>

      <div id="optionsBlock" style="display:none;">
        <div class="field-row">
          <label>Watermark text</label>
          <input type="text" id="textInput" value="CONFIDENTIAL" maxlength="60">
        </div>
        <div class="field-row">
          <label>Opacity <span class="hint" id="opacityHint">30%</span></label>
          <input type="range" id="opacityInput" min="10" max="80" value="30">
        </div>
        <div class="field-row">
          <label>Color</label>
          <div class="radio-group">
            <label><input type="radio" name="color" value="gray" checked> Gray</label>
            <label><input type="radio" name="color" value="red"> Sealing red</label>
            <label><input type="radio" name="color" value="black"> Black</label>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="applyBtn">Add watermark</button>
        </div>
      </div>

      <div class="status" id="status"></div>

      <div class="result-box" id="resultBox">
        <div class="rtext"><strong id="resultName"></strong><span id="resultMeta"></span></div>
        <button class="btn btn-primary" id="downloadBtn">Download</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Dossier — browser-only PDF tools.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="js/common.js"></script>
<script src="js/tools/watermark.js"></script>
</body>
</html>
